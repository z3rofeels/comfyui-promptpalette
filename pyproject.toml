[project]
name = "zf-prompt-palette"
version = "2.0.6"
description = "Prompt editing and organization for ComfyUI: reusable wildcard libraries, a sidebar style gallery, offline Booru and Anima artist autocomplete, field-based prompt variations, conditional logic, combinatorial batches, and model-aware weighting."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "z3rofeels" },
]
keywords = [
    "comfyui", "prompt-editor", "prompt-library", "wildcards",
    "dynamic-prompts", "autocomplete", "booru", "danbooru",
    "anima", "artist-tags", "style-gallery", "prompt-variations",
    "combinatorial", "batch-prompts", "prompt-weighting",
]
dependencies = [
    "PyYAML>=6.0",
    "typing-extensions>=4.12",
]
classifiers = [
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

[project.urls]
Homepage = "https://github.com/z3rofeels/comfyui-promptpalette"
Repository = "https://github.com/z3rofeels/comfyui-promptpalette"
Documentation = "https://github.com/z3rofeels/comfyui-promptpalette#readme"
"Bug Tracker" = "https://github.com/z3rofeels/comfyui-promptpalette/issues"
Discussions = "https://github.com/z3rofeels/comfyui-promptpalette/discussions"

[tool.comfy]
PublisherId = "z3rofeels"
DisplayName = "Prompt Palette"
Icon = "https://raw.githubusercontent.com/z3rofeels/comfyui-promptpalette/main/assets/prompt-palette-icon.png"
Banner = "https://raw.githubusercontent.com/z3rofeels/comfyui-promptpalette/main/assets/prompt-palette-banner.png"
