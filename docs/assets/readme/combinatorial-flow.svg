<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300" role="img" aria-labelledby="title desc"><title id="title">Choices become prompt rows</title><desc id="desc">In Combinatorial mode, two subjects times two lighting choices produce four prompt rows in one execution, subject to max_prompts.</desc><defs><linearGradient id="back" x2="1" y2="1"><stop stop-color="#202321"/><stop offset=".65" stop-color="#141719"/><stop offset="1" stop-color="#181c21"/></linearGradient></defs><g font-family="Arial"><rect x="0" y="0" width="1600" height="300" rx="20" fill="url(#back)" /><text x="64" y="56" font-size="22" font-weight="500" fill="#58d8ed" font-family="Source Code Pro, monospace">COMBINATORIAL / ONE EXECUTION</text><text x="64" y="145" font-size="47" font-weight="500" fill="#58d8ed" font-family="Source Code Pro, monospace">{cat|dog}</text><text x="365" y="145" font-size="44" font-weight="400" fill="#b9b9b1" >×</text><text x="433" y="145" font-size="47" font-weight="500" fill="#ff817c" font-family="Source Code Pro, monospace">{day|night}</text><text x="829" y="145" font-size="57" font-weight="400" fill="#b9b9b1" >→</text><text x="941" y="143" font-size="49" font-weight="700" fill="#f4f0e8" >4 prompt rows</text><text x="64" y="232" font-size="30" font-weight="400" fill="#b9b9b1" >Each unmarked group expands; max_prompts limits the set.</text></g></svg>
