<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="410" viewBox="0 0 1600 410" role="img" aria-labelledby="title desc">
  <title id="title">13 Updated Bundled Workflows — 5-Stage Architecture</title>
  <desc id="desc">Overview of the 13 updated bundled workflows: 5 color-coded stage groups from Load Models, Prompt Palette with Fields and Model passthrough, Resolution Selector and Guidance, KSampler, to VAE Decode and Save.</desc>
  <defs>
    <linearGradient id="back" x2="1" y2="1">
      <stop stop-color="#202321"/>
      <stop offset=".65" stop-color="#141719"/>
      <stop offset="1" stop-color="#181c21"/>
    </linearGradient>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="1600" height="410" rx="20" fill="url(#back)"/>

    <!-- Header -->
    <text x="64" y="54" font-size="21" font-weight="600" fill="#b3a0eb" font-family="Source Code Pro, monospace">BUNDLED WORKFLOWS / 13 UPDATED TEMPLATES</text>
    <text x="64" y="108" font-size="44" font-weight="700" fill="#f4f0e8" letter-spacing="-1">5 color-coded stages, Fields, and matched latents.</text>

    <!-- Stage 1 -->
    <rect x="64" y="144" width="260" height="168" rx="12" fill="#1e2225" stroke="#3c4143" stroke-width="1.5"/>
    <rect x="64" y="144" width="260" height="5" rx="2.5" fill="#58d8ed"/>
    <text x="84" y="182" font-size="14" font-weight="700" fill="#58d8ed" font-family="Source Code Pro, monospace">STAGE 1</text>
    <text x="84" y="216" font-size="23" font-weight="700" fill="#f4f0e8">Load Models</text>
    <text x="84" y="248" font-size="17" fill="#b9b9b1">Diffusion, CLIP, and</text>
    <text x="84" y="272" font-size="17" fill="#b9b9b1">VAE loaders ready.</text>

    <text x="342" y="236" font-size="30" fill="#7e8587" text-anchor="middle">→</text>

    <!-- Stage 2 -->
    <rect x="360" y="144" width="276" height="168" rx="12" fill="#1e2225" stroke="#3c4143" stroke-width="1.5"/>
    <rect x="360" y="144" width="276" height="5" rx="2.5" fill="#dda253"/>
    <text x="380" y="182" font-size="14" font-weight="700" fill="#dda253" font-family="Source Code Pro, monospace">STAGE 2</text>
    <text x="380" y="216" font-size="23" font-weight="700" fill="#f4f0e8">Prompt Palette</text>
    <text x="380" y="248" font-size="17" fill="#b9b9b1">Pre-filled Fields +</text>
    <text x="380" y="272" font-size="17" fill="#b9b9b1">Model (passthrough).</text>

    <text x="654" y="236" font-size="30" fill="#7e8587" text-anchor="middle">→</text>

    <!-- Stage 3 -->
    <rect x="672" y="144" width="276" height="168" rx="12" fill="#1e2225" stroke="#3c4143" stroke-width="1.5"/>
    <rect x="672" y="144" width="276" height="5" rx="2.5" fill="#b3a0eb"/>
    <text x="692" y="182" font-size="14" font-weight="700" fill="#b3a0eb" font-family="Source Code Pro, monospace">STAGE 3</text>
    <text x="692" y="216" font-size="23" font-weight="700" fill="#f4f0e8">Reso &amp; Guidance</text>
    <text x="692" y="248" font-size="17" fill="#b9b9b1">Resolution Selector</text>
    <text x="692" y="272" font-size="17" fill="#b9b9b1">matched to 4/16/128ch.</text>

    <text x="966" y="236" font-size="30" fill="#7e8587" text-anchor="middle">→</text>

    <!-- Stage 4 -->
    <rect x="984" y="144" width="260" height="168" rx="12" fill="#1e2225" stroke="#3c4143" stroke-width="1.5"/>
    <rect x="984" y="144" width="260" height="5" rx="2.5" fill="#40c8b7"/>
    <text x="1004" y="182" font-size="14" font-weight="700" fill="#40c8b7" font-family="Source Code Pro, monospace">STAGE 4</text>
    <text x="1004" y="216" font-size="23" font-weight="700" fill="#f4f0e8">Sample</text>
    <text x="1004" y="248" font-size="17" fill="#b9b9b1">Tuned steps, CFG,</text>
    <text x="1004" y="272" font-size="17" fill="#b9b9b1">sampler &amp; scheduler.</text>

    <text x="1262" y="236" font-size="30" fill="#7e8587" text-anchor="middle">→</text>

    <!-- Stage 5 -->
    <rect x="1280" y="144" width="256" height="168" rx="12" fill="#1e2225" stroke="#3c4143" stroke-width="1.5"/>
    <rect x="1280" y="144" width="256" height="5" rx="2.5" fill="#ff817c"/>
    <text x="1300" y="182" font-size="14" font-weight="700" fill="#ff817c" font-family="Source Code Pro, monospace">STAGE 5</text>
    <text x="1300" y="216" font-size="23" font-weight="700" fill="#f4f0e8">Decode &amp; Save</text>
    <text x="1300" y="248" font-size="17" fill="#b9b9b1">VAE Decode +</text>
    <text x="1300" y="272" font-size="17" fill="#b9b9b1">Save Image / Video.</text>

    <!-- Bottom summary bar -->
    <rect x="64" y="336" width="1472" height="46" rx="10" fill="#181b1e" stroke="#3c4143" stroke-width="1"/>
    <text x="86" y="365" font-size="17" font-weight="600" fill="#b3a0eb" font-family="Source Code Pro, monospace">INCLUDED:</text>
    <text x="200" y="365" font-size="17" fill="#b9b9b1" font-family="Source Code Pro, monospace">11 Image Workflows (Resolution Selector matched)  ·  2 Video Workflows (LTX-2.3 &amp; MiniMax H3)  ·  4 LabelPal Setup &amp; Tip Cards</text>
  </g>
</svg>
