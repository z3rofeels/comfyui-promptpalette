<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="240" viewBox="0 0 1600 240" role="img" aria-labelledby="title desc"><title id="title">Your first prompt in three steps</title><desc id="desc">After installation restart ComfyUI, add Prompt Palette, write a prompt, inspect Resolved Preview, and connect the required outputs.</desc><defs><linearGradient id="back" x2="1" y2="1"><stop stop-color="#202321"/><stop offset=".65" stop-color="#141719"/><stop offset="1" stop-color="#181c21"/></linearGradient></defs><g font-family="Arial"><rect x="0" y="0" width="1600" height="240" rx="20" fill="url(#back)" /><circle cx="85" cy="75" r="23" fill="#dda253"/><text x="85" y="84" font-size="22" font-weight="700" fill="#141719" text-anchor="middle">01</text><text x="127" y="86" font-size="32" font-weight="700" fill="#f4f0e8" >Add Prompt Palette</text><text x="127" y="137" font-size="27" font-weight="400" fill="#b9b9b1" >Restart after installation,</text><text x="127" y="176" font-size="27" font-weight="400" fill="#b9b9b1" >then search the node menu.</text><circle cx="614" cy="75" r="23" fill="#58d8ed"/><text x="614" y="84" font-size="22" font-weight="700" fill="#141719" text-anchor="middle">02</text><text x="656" y="86" font-size="32" font-weight="700" fill="#f4f0e8" >Write a prompt</text><text x="656" y="137" font-size="27" font-weight="400" fill="#b9b9b1" >Type normally or add</text><text x="656" y="176" font-size="27" font-weight="400" fill="#b9b9b1" >a __wildcard__ reference.</text><circle cx="1143" cy="75" r="23" fill="#ff817c"/><text x="1143" y="84" font-size="22" font-weight="700" fill="#141719" text-anchor="middle">03</text><text x="1185" y="86" font-size="32" font-weight="700" fill="#f4f0e8" >Check the result</text><text x="1185" y="137" font-size="27" font-weight="400" fill="#b9b9b1" >Open Resolved Preview;</text><text x="1185" y="176" font-size="27" font-weight="400" fill="#b9b9b1" >connect the outputs you need.</text></g></svg>
