<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="340" viewBox="0 0 1600 340" role="img" aria-labelledby="title desc"><title id="title">Route explicit weights to the right backend</title><desc id="desc">The explicit weight example remains weighted for Standard CLIP and Anima; Qwen and LLM text modes produce clean prose. The README documents compatible downstream weighting routes and optional controls.</desc><defs><linearGradient id="back" x2="1" y2="1"><stop stop-color="#202321"/><stop offset=".65" stop-color="#141719"/><stop offset="1" stop-color="#181c21"/></linearGradient></defs><g font-family="Arial"><rect x="0" y="0" width="1600" height="340" rx="20" fill="url(#back)" /><text x="64" y="56" font-size="22" font-weight="500" fill="#dda253" font-family="Source Code Pro, monospace">WEIGHT CONTROLLER / BACKEND-AWARE ROUTING</text><text x="64" y="181" font-size="45" font-weight="500" fill="#dda253" font-family="Source Code Pro, monospace">(red fox:1.35)</text><text x="510" y="181" font-size="53" font-weight="400" fill="#b9b9b1" >→</text><text x="646" y="118" font-size="29" font-weight="700" fill="#f4f0e8" >SDXL / CLIP</text><text x="1050" y="118" font-size="33" font-weight="500" fill="#dda253" font-family="Source Code Pro, monospace">(red fox:1.35)</text><text x="646" y="187" font-size="29" font-weight="700" fill="#f4f0e8" >Qwen / T5 / LLM</text><text x="1050" y="187" font-size="33" font-weight="500" fill="#58d8ed" font-family="Source Code Pro, monospace">red fox</text><text x="646" y="256" font-size="29" font-weight="700" fill="#f4f0e8" >Anima</text><text x="1050" y="256" font-size="33" font-weight="500" fill="#dda253" font-family="Source Code Pro, monospace">(red fox:1.35)</text><text x="64" y="305" font-size="24" font-weight="400" fill="#b9b9b1" >Text routing example · optional controls have separate effects.</text></g></svg>
